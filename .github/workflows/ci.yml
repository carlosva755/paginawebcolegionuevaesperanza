name: Integración Continua (CI) - Plataforma de Alerta Temprana

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Compilación y Pruebas Unitarias de alertas-service (C# .NET 8)
  # ----------------------------------------------------------------------------
  build-and-test-alertas:
    name: Build & Test Alertas Service (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias de Alertas Service
        run: dotnet restore alertas-service/AlertasService.csproj

      - name: Compilar Alertas Service
        run: dotnet build alertas-service/AlertasService.csproj --configuration Release --no-restore

      - name: Ejecutar pruebas unitarias xUnit
        run: dotnet test alertas-service.Tests/AlertasService.Tests.csproj --configuration Release --verbosity normal

  # ----------------------------------------------------------------------------
  # Job 2: Verificación y Pruebas de acompanamiento-service (Node.js 20)
  # ----------------------------------------------------------------------------
  build-and-test-acompanamiento:
    name: Build & Test Acompañamiento Service (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: acompanamiento-service/package.json

      - name: Instalar dependencias
        working-directory: ./acompanamiento-service
        run: npm install

      - name: Ejecutar pruebas Jest
        working-directory: ./acompanamiento-service
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 3: Compilación y Linting del Frontend (React + Vite)
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar bundle para producción
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_ALERTAS_API_URL: http://localhost:5001/api/v1
          VITE_ACOMPANAMIENTO_API_URL: http://localhost:5002/api/v1

  # ----------------------------------------------------------------------------
  # Job 4: Validación de Sintaxis de Docker y Docker Compose
  # ----------------------------------------------------------------------------
  validate-docker:
    name: Validar Configuración Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar archivo docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
